<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pilot Implementation Plan - Interactive Gantt</title>
  <style>
    body { 
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; 
      margin: 0; 
      padding: 24px; 
      background: #0f1214; 
      color: #eaecef; 
    }
    h1 { 
      font-size: 24px; 
      margin-bottom: 8px; 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      height: 50px;
      width: auto;
    }
    p { 
      color: #aab; 
    }
    #chart { 
      width: 100%; 
      height: 600px; 
    }
    .footer { 
      margin-top: 24px; 
      font-size: 12px; 
      color: #8a94a6; 
    }
  </style>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<body>
  <h1>
    Pilot Implementation Plan - Interactive Gantt
    <img src="https://upload.wikimedia.org/wikipedia/en/thumb/7/74/Higgins_logo.png/440px-Higgins_logo.png" alt="Higgins Logo" class="logo">
  </h1>
  <p>Use zoom/pan and hover to explore dates and phases.</p>
  <div id="chart"></div>
  <script>
    const data = [
      { "Phase": "Kickoff & Design", "Start": "2025-11-24", "Finish": "2025-12-07" },
      { "Phase": "Procurement & Setup", "Start": "2025-12-08", "Finish": "2025-12-21" },
      { "Phase": "Installation", "Start": "2025-12-22", "Finish": "2026-01-04" },
      { "Phase": "Integration", "Start": "2026-01-05", "Finish": "2026-01-11" },
      { "Phase": "Testing", "Start": "2026-01-12", "Finish": "2026-01-18" },
      { "Phase": "Data Analysis", "Start": "2026-01-19", "Finish": "2026-01-25" },
      { "Phase": "Reporting & Handover", "Start": "2026-01-26", "Finish": "2026-02-01" }
    ];

    // Color palette for phases
    const colors = ['#5b7cfa', '#748ffc', '#339af0', '#22b8cf', '#20c997', '#51cf66', '#ffd43b'];

    // Create traces using scatter with shapes
    const traces = data.map((d, idx) => {
      const start = new Date(d.Start);
      const finish = new Date(d.Finish);
      const duration = (finish - start) / (1000 * 60 * 60 * 24);
      
      return {
        x: [start, finish],
        y: [d.Phase, d.Phase],
        mode: 'lines+markers',
        line: {
          color: colors[idx % colors.length],
          width: 20
        },
        marker: {
          size: 0
        },
        name: d.Phase,
        hovertemplate: `<b>${d.Phase}</b><br>Start: ${start.toLocaleDateString()}<br>End: ${finish.toLocaleDateString()}<br>Duration: ${Math.round(duration)} days<extra></extra>`,
        showlegend: false
      };
    });

    const layout = {
      title: 'Gantt Chart - Pilot Implementation (10 Weeks)',
      xaxis: {
        type: 'date',
        title: 'Timeline'
      },
      yaxis: {
        automargin: true
      },
      plot_bgcolor: '#1a1e24',
      paper_bgcolor: '#0f1214',
      font: { color: '#eaecef', size: 12 },
      margin: { l: 200, r: 40, t: 80, b: 60 },
      hovermode: 'closest'
    };

    Plotly.newPlot('chart', traces, layout, { responsive: true });
  </script>
  <div class="footer">© 2025 Brian Perry Civil - Pilot Implementation Plan</div>
</body>
</html>
